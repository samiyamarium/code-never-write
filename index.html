<header><div class="w"><h1>Code You Never Write</h1>
<p>Every named process, test, procedure and framework from the crash course, drawn as a flow. Wording is as given on the page.</p>
<div class="legend"><span class="chip">Step</span><span class="chip a">AI</span><span class="chip c">Collaborative</span><span class="chip h">Human</span><span class="chip w">Flagged / problem</span></div></div></header>
<nav><div class="w" id="nav"></div></nav>
<main class="w" style="padding:0 20px" id="app"></main>

<script>
const S=[
["Overview",[
["The core move","Intro","chain",["Describe the problem in plain words","Let the AI write and run the code","Check what it did"],"You are not learning to write code. You are learning to be a good client for code."],

["Prove it in two minutes","Prove it in two minutes","chain",["Paste expenses; ask: write and run code, show me it ran","The AI writes a small program and computes the totals","Hand-check: 4,250 + 2,890 + 3,120","Does it match what your code reported?|the seed of Concept 6"]],
["By the end, you can","What you need","chain",["Spot a code problem","Write a five-section code brief","Force computation over estimation","Check a result you cannot read","Run scripts safely on real files","Keep what you build"]],
["The 30-minute path","Short on time?","chain",["Read Concepts 3 to 6","Run each one’s Do this now box","Come back later for Part 3, Concept 12, and the Projects"]]]],
["Part 1: The deal",[
["AI is the developer, you are the client","1. Code is no longer gated by coding","chain",["AI writes working code|small, well-described problems","AI runs the code itself|in a sandbox, or on your machine with permission","AI repairs the code itself|the error message goes back to the AI"],"The unit of work changes: not ‘can I write this?’ but ‘can I describe this?’"],
["How the AI picks the language","2. What code actually is","fan","You describe what you want back",[["A number, file, or report","Python"],["A thing you click or open in a browser","JavaScript or TypeScript"]],"You never choose. The choice follows the output."],
["Code is exact, in both directions","2","fan","Code is exact",[["Good","Computes your totals to the last cent, any number of times"],["w:Dangerous","Does exactly what it was told, including the wrong thing, perfectly, at scale"]],"Power and danger come from the same property."],
["The dividing line","3. The dividing line","fan","Is this a question for the AI’s mind, or a job for the AI’s hands?",[["a:Answer problem","The AI replies from its own reasoning: draft, advise, summarize, explain, judge an idea"],["c:Code problem","The AI writes and runs code on your real data: total, merge, scan, rename, clean, reconcile, chart, automate"]]],
["Four signals: VPRF","3","map",[["Volume","More items than you would do by hand"],["Precision","A wrong digit has consequences"],["Repetition","You will face this task again"],["Files","The problem lives in files, not in sentences"]],"Any one of them is enough. If a task fires none, it is an answer problem."],
["The trap","3","chain",["A problem that looks like an answer problem|‘Roughly how did my sales trend?’","w:It fires Precision if a decision rests on the number","It is a code problem, however casually phrased|Concept 4 is the fix"]]]],
["Part 2: Commissioning code",[

["How your phrasing steers the AI","4","map",[["‘What does this data show?’","Glance-based summary, maybe code: estimates dressed as facts"],["‘Roughly how did costs trend?’","Almost always a glance: ‘roughly’ says precision does not matter"],["‘Write and run code to compute cost by month.’","Code, every time"],["‘Are you running code on this file, or estimating? If estimating, stop and run code instead.’","The AI names its method, then computes"]]],

["Minimum verification by stakes","6","map",[["Personal curiosity (your own spending)","Reality questions"],["Work a colleague relies on","Known-answer test and plain-English replay"],["Money, grades, health, anything signed","All five, and a human reviews the claims that matter"]]],
["The pharmacist’s trap","6","chain",["Add one fake gap of 10 units to a copy of the data","The script catches the fake gap, plus four real ones","Catching the fake one let her believe the four"],"Add one known error to your data and see if the code finds it."],

["The one thing you never skip","6","chain",["A precision-critical number","Test it against one answer you independently know","Then act on it"]],

["Wrong-but-running","7","chain",["State the symptom|total is 4.2 million","State the value you expected|around 12 million","Ask it to inspect first|row count, date range, first 5 rows as the code sees them","Then fix"]],
["Three strikes","7","chain",["Same fix fails three times","Step back: restate the problem fresh","Propose two completely different approaches","Chat long and confused? Start a clean one with the brief and what you learned"]],
["Keep the script: three-part habit","8. Keep the script","chain",["Ask for the script as a file|plain-English description at the top","Keep the brief next to the script|the Intent Layer","Give the pair a home in one folder"],"A script written once is something you own forever."],
["The folder","8","fan","my-scripts/: one subfolder per task",[["brief.md","What and why, in your words"],["script (e.g. submissions.py)","The code: you still never read it"],["sample input folder","Inputs whose correct answer you know: tomorrow’s known-answer test"]]],

["Part 3: One problem, five surfaces",[

["Choosing a surface","11","map",[["One-off question about a file or a few files","Claude.ai (or ChatGPT / Gemini)"],["Learning, exploring, or a borrowed computer","Claude.ai: the sandbox cannot hurt anything"],["The problem lives in your folders and you will repeat it","Claude Code or OpenCode"],["You want an app and a plan to approve before anything moves","Cowork or OpenWork"],["The task must run on a schedule or touch other systems","Claude Code or OpenCode"]]],
["The running job on Claude.ai","9","chain",["1. Merge all 12 CSVs|confirm row count and all 12 months before going further","2. Total spending by category and by month","3. Flag likely duplicates|list them, don’t delete anything","4. One-page HTML report|trend chart, category table, duplicates list, three observations"],"Rules: commas as thousand separators; refunds negative; unparseable rows skipped and listed."],
["The running job in a terminal agent","10","chain",["No attachments: the files are simply there","The agent writes the code and runs it","It hits the comma-separator problem and fixes it itself","report.html and monthly-report.py appear in the folder"]],
["Plan-then-approve","11","chain",["The app writes a plan","You read the plan in plain English|catch the wrong assumption before anything runs","You approve","The code runs"],"Concept 6’s plain-English replay, moved before the work instead of after."]]],
["Part 4: Power, safely held",[
["Blast radius: four rules","12. Blast radius","map",[["Rule 1: Work on copies until a script has earned trust","‘First copy the folder to expenses-2025-backup, then work only on the original.’"],["Rule 2: See changes before they happen","Dry run: ‘Don’t change anything yet. Show me the full list of operations, old name next to new name, and wait for my approval.’"],["Rule 3: Point the agent at the smallest folder","Never your home directory, never Documents, never the whole disk"],["Rule 4: Write output to new files, never over the originals","Every run can be undone by deleting the new file"]],"Blast radius: the worst thing that can happen if a run goes wrong."],
["The four rules in three sentences","12","chain",["Copy the folder to a backup first","Show me your plan of operations before changing anything, and wait for approval","Write all output to new files. Never modify the originals"]],
["Permission ladder","12","chain",["Give a tool a little freedom first","Watch what it does","Give it more|trust goes to specific scripts with a track record"]],
["The researcher’s dry run","12","chain",["Dry-run list: 40 proposed deletions","Six were wrongly grouped|different interviews, identical lengths","Corrected rule: match on content, not name and size","Run the dry run again","Approve 34 true deletions"]],
